/* ============================================================
   13. ARCADE — shared engine, one adapter per module

   Rules (as specified):
     30s clock. Shapes fade in for 2s each.
     70% gold / 30% blue, independent of whether the shape is a right answer.
     Correct: 200 pts under 0.5s, 150 to 1s, 100 to 1.5s, 50 after.
              Blue also adds 1 second to the clock.
     Wrong tap: -100.
     A hidden play-time counter drives the difficulty ramp: one more shape
     allowed on screen every 10s, up to 5. At the start a new shape only
     appears once the previous one begins fading. Shapes never overlap.
   ============================================================ */
/* --- sound: synthesised so the file stays standalone, no assets --- */
let AC=null, sfxOn=true;
function audioWake(){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
  }catch(e){ AC=null; }
}
function tone(freq,delay,dur,type,vol,glide){
  if(!AC||!sfxOn) return;
  const t0=AC.currentTime+delay;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  if(glide) o.frequency.exponentialRampToValueAtTime(glide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
/* gold: a bright two-note lift */
function sfxGold(){
  tone(1046.5,0,   .20,"triangle",.20);      // C6
  tone(1567.98,.07,.26,"triangle",.17);      // G6
}
/* blue: a fuller four-note arpeggio with a bell tail — clearly the better prize */
function sfxBlue(){
  [1046.5,1318.51,1567.98,2093].forEach((f,i)=>tone(f,i*.055,.30,"triangle",.17));
  tone(2093,.24,.55,"sine",.10);
  tone(3136,.26,.45,"sine",.05);
}
/* wrong: a short detuned buzz that slides down */
function sfxWrong(){
  tone(196,0,.20,"sawtooth",.15,104);
  tone(207,0,.20,"square",  .09,110);
}

const ARC_LIFE=2000, ARC_FADE=1500;      // shape total life, and when fade-out begins
const arcMem={};
function arcBest(k){ try{ return +localStorage.getItem("wb_"+k)||0; }catch(e){ return arcMem[k]||0; } }
function arcSaveBest(k,v){ try{ localStorage.setItem("wb_"+k,v); }catch(e){ arcMem[k]=v; } }

/* ---- shared shell: clock, score, best, combo, title and end screens ----

   Every duration in both arcades is expressed as a base value times `tm`,
   so difficulty is one number. Hard is the original pacing (tm 1); Normal
   stretches everything by 1.5. Tweak TM_NORMAL and nothing else drifts.     */
const TM_HARD=1, TM_NORMAL=1.5;
function loadDiff(){ try{ return localStorage.getItem("wb_diff")||"normal"; }catch(e){ return arcMem.diff||"normal"; } }
function saveDiff(v){ try{ localStorage.setItem("wb_diff",v); }catch(e){ arcMem.diff=v; } }

function arcadeShell(stage,cfg){
  stage.classList.add("arcade");
  const top=h("div","arc-top");
  const elClock=h("div","arc-clock","30.00s");
  top.appendChild(elClock);
  if(cfg.topExtra) top.appendChild(cfg.topExtra);   // e.g. the angle game's target
  stage.appendChild(top);
  const hud=h("div","hud-score");
  const mk=lab=>{ const d=h("div"), b=h("b","0"); d.append(b,h("span",null,t(lab))); hud.appendChild(d); return b; };
  const elScore=mk("scoreL"), elBest=mk("bestL");
  stage.appendChild(hud);
  const bar=h("div","arc-bar"); bar.style.width="100%"; stage.appendChild(bar);
  const mute=h("button","arc-mute",sfxOn?"🔊":"🔇");
  mute.onclick=()=>{ sfxOn=!sfxOn; mute.textContent=sfxOn?"🔊":"🔇"; };
  stage.appendChild(mute);
  const comboPos=cfg.comboPos||"tl";
  const comboEl=h("div","combo "+comboPos); stage.appendChild(comboEl);

  let diff=loadDiff();
  let tm=diff==="hard"?TM_HARD:TM_NORMAL;
  const bestKey=()=>cfg.key+"_"+diff;
  let best=arcBest(bestKey()); elBest.textContent=best;

  let running=false, raf=0, last=0, score=0, timeLeft=0, total=0, played=0;
  let combo=0, mult=1;

  function paintCombo(bump){
    comboEl.className="combo "+comboPos+(bump?" bump":"");
    comboEl.innerHTML="";
    if(combo<2) return;                             // only shows from combo 2
    const txt=t("comboLbl")+" "+combo+": "+mult.toFixed(1)+"x";
    [...txt].forEach((ch,i)=>{
      const sp=h("span",null,ch===" "?"\u00A0":ch);
      sp.style.animationDelay=(i*18)+"ms";
      comboEl.appendChild(sp);
    });
  }
  function breakCombo(){
    if(combo>=2){                                   // let the old counter fall away
      const ghost=comboEl.cloneNode(true);
      ghost.className="combo "+comboPos+" broke";
      [...ghost.children].forEach((sp,i)=>{
        sp.style.animationDelay=(i*26)+"ms";
        sp.style.setProperty("--r",(Math.random()*70-35).toFixed(0)+"deg");
      });
      stage.appendChild(ghost);
      setTimeout(()=>ghost.remove(),1200);
    }
    combo=0; mult=1; paintCombo(false);
  }

  const api={
    stage:stage,
    get running(){ return running; },
    get played(){ return played; },
    get tm(){ return tm; },
    get hard(){ return diff==="hard"; },
    get mult(){ return mult; },
    /* a hit: extend the combo, scale the points, hand back the total to display */
    award(pts){
      combo++; mult=1+0.1*(combo-1);
      const totalPts=Math.round(pts*mult);
      score+=totalPts; elScore.textContent=score;
      paintCombo(true);
      return totalPts;
    },
    /* a miss: flat penalty, combo collapses */
    penalise(pts){
      score=Math.max(0,score-pts); elScore.textContent=score;
      breakCombo();
    },
    addTime(ms){ timeLeft+=ms; },
    pop(x,y,text,color){
      const el=h("div","arc-pop",text);
      el.style.left=x+"px"; el.style.top=y+"px"; el.style.color=color;
      stage.appendChild(el);
      setTimeout(()=>el.remove(),900);
    }
  };
  function stop(){ running=false; cancelAnimationFrame(raf); raf=0; }
  pending.push(()=>{ stop(); cfg.cleanup&&cfg.cleanup(); });

  function paint(){
    // pad from the ROUNDED string: 9.999 rounds to "10.00", and testing the raw
    // value first would prepend a zero and print 010.00s
    let cs=(Math.max(0,timeLeft)/1000).toFixed(2);
    if(cs.indexOf(".")===1) cs="0"+cs;
    elClock.textContent=cs+"s";
    elClock.classList.toggle("low",timeLeft<=5000*tm);
    bar.style.width=Math.min(100,timeLeft/total*100)+"%";
    bar.classList.toggle("low",timeLeft<=5000*tm);
  }
  function frame(now){
    if(!running) return;
    const dt=Math.min(120,now-last); last=now;
    played+=dt; timeLeft-=dt;
    if(timeLeft<=0){ timeLeft=0; paint(); return end(); }
    cfg.frame(dt,played,api);
    paint();
    raf=requestAnimationFrame(frame);
  }
  function screen(build){
    const dim=h("div","dim"); const box=h("div","dimbox");
    build(box,dim); dim.appendChild(box); stage.appendChild(dim);
    return dim;
  }
  function begin(){
    score=0; played=0; combo=0; mult=1; paintCombo(false);
    total=30000*tm; timeLeft=total;
    elScore.textContent="0"; paint();
    cfg.reset(api);
    running=true; last=performance.now();
    raf=requestAnimationFrame(frame);
  }
  function end(){
    stop();
    cfg.cleanup&&cfg.cleanup();
    combo=0; mult=1; paintCombo(false);
    const record=score>best;
    if(record){ best=score; arcSaveBest(bestKey(),best); elBest.textContent=best; }
    screen((box,dim)=>{
      box.appendChild(h("div","arc-big",t("timeUp")));
      if(record) box.appendChild(h("div","arc-new",t("newBest")));
      box.appendChild(h("div","arc-final",String(score)));
      const sub=h("div","arc-sub");
      sub.append(h("div",null,t("playedFor")((played/1000).toFixed(1))),
                 h("div",null,t("finalBest")(best)));
      box.appendChild(sub);
      const b=h("button","nextbtn",t("again"));
      b.onclick=()=>{ audioWake(); dim.remove(); begin(); };
      box.appendChild(b);
    });
  }
  screen((box,dim)=>{
    box.appendChild(h("div","arc-big",t("ready")));
    box.appendChild(h("p","arc-how",t(cfg.how)));
    box.appendChild(h("div","difflabel",t("diffPick")));
    const row=h("div","diffrow");
    [["normal","diffN"],["hard","diffH"]].forEach(([d,k])=>{
      const b=h("button","diffbtn",t(k));
      b.setAttribute("aria-pressed",d===diff);
      b.onclick=()=>{
        diff=d; saveDiff(d); tm=d==="hard"?TM_HARD:TM_NORMAL;
        best=arcBest(bestKey()); elBest.textContent=best;
        [...row.children].forEach((x,i)=>x.setAttribute("aria-pressed",i===(d==="normal"?0:1)));
      };
      row.appendChild(b);
    });
    box.appendChild(row);
    box.appendChild(h("div","diffnote",t("diffNote")));
    const rules=h("div","arc-rule");
    cfg.rules.forEach(([c,k])=>{
      const line=h("div"); const sw=h("i"); sw.style.background=c;
      line.append(sw,document.createTextNode(t(k))); rules.appendChild(line);
    });
    box.appendChild(rules);
    const b=h("button","nextbtn",t("start"));
    b.onclick=()=>{ audioWake(); dim.remove(); begin(); };
    box.appendChild(b);
  });
  return api;
}

/* ============================================================
   ARCADE 1 — Solid Lab: tap the nets that fold into a cube
   30s. Shapes live 2s. 70% gold / 30% blue. 200/150/100/50 by
   speed; blue adds a second; wrong tap -100. One more shape
   allowed on screen every 10s of hidden play time, up to 5.
   ============================================================ */
function arcPoints(ageMs,tm){
  const a=ageMs/tm;                        // bands stretch with the pacing
  if(a<500)  return 200;
  if(a<1000) return 150;
  if(a<1500) return 100;
  return 50;
}
/* the largest bounding box any of the 35 shapes occupies, in cells */
const HEX_BOX=(()=>{
  let w=0,h=0;
  for(const c of [...NETS_CUBE,...NOTNETS]){
    const rs=c.map(p=>p[0]), cs=c.map(p=>p[1]);
    w=Math.max(w,Math.max(...cs)-Math.min(...cs)+1);
    h=Math.max(h,Math.max(...rs)-Math.min(...rs)+1);
  }
  return {w,h};
})();
/* Lay the play area out as a grid of slots, one shape per slot. Overlap then
   becomes impossible by construction rather than something rejection sampling
   has to stumble on, which also lets the shapes be far bigger. Pick whichever
   grid gives the largest cell while still offering at least 5 slots. */
const ARC_TOP=92, ARC_BOT=28, ARC_SIDE=16, ARC_GAP=16;
function slotPlan(stage){
  const pw=Math.max(80,stage.clientWidth-ARC_SIDE*2);
  const ph=Math.max(80,stage.clientHeight-ARC_TOP-ARC_BOT);
  let best=null;
  for(let cols=1;cols<=7;cols++) for(let rows=1;rows<=4;rows++){
    if(cols*rows<5) continue;                       // never fewer slots than shapes
    const sw=pw/cols, sh=ph/rows;
    const cell=Math.min((sw-ARC_GAP)/HEX_BOX.w,(sh-ARC_GAP)/HEX_BOX.h);
    if(!best||cell>best.cell) best={cell,cols,rows,sw,sh};
  }
  best.cell=Math.max(13,Math.min(62,Math.floor(best.cell)));
  best.pw=pw; best.ph=ph;
  return best;
}
function arcCubeShape(cell){
  const correct=Math.random()<0.5;
  const cells=correct?rand(NETS_CUBE):rand(NOTNETS);
  const blue=Math.random()<0.3;                       // 70% gold / 30% blue
  const rows=cells.map(p=>p[0]), cols=cells.map(p=>p[1]);
  const r0=Math.min(...rows), c0=Math.min(...cols);
  const nr=Math.max(...rows)-r0+1, nc=Math.max(...cols)-c0+1;
  const svg=document.createElementNS(SVGNS,"svg");
  const w=nc*cell, hgt=nr*cell;
  svg.setAttribute("width",w); svg.setAttribute("height",hgt);
  svg.setAttribute("viewBox","0 0 "+w+" "+hgt);
  for(const [r,c] of cells){
    const rc=document.createElementNS(SVGNS,"rect");
    rc.setAttribute("x",(c-c0)*cell); rc.setAttribute("y",(r-r0)*cell);
    rc.setAttribute("width",cell); rc.setAttribute("height",cell);
    rc.setAttribute("rx",3);
    rc.setAttribute("fill",blue?"var(--c3)":"var(--c1)");
    rc.setAttribute("stroke","rgba(255,255,255,.85)");
    rc.setAttribute("stroke-width",2);
    svg.appendChild(rc);
  }
  return {el:svg,w:w,h:hgt,correct:correct,blue:blue};
}
function renderCubeArcade(side,stage){
  let shapes=[], plan=slotPlan(stage);
  const clear=()=>{ shapes.forEach(s=>s.el.remove()); shapes=[]; };
  observeSize(stage,()=>{ plan=slotPlan(stage); });

  function spawn(api,played){
    const taken=new Set(shapes.map(s=>s.slot));
    const free=[];
    for(let i=0;i<plan.cols*plan.rows;i++) if(!taken.has(i)) free.push(i);
    if(!free.length) return;                  // cannot happen while the cap is 5
    const slot=rand(free);
    const made=arcCubeShape(plan.cell);
    // sit the shape anywhere inside its own slot, inset by half the gap on each
    // side — neighbouring slots therefore stay a full gap apart
    const sx=ARC_SIDE+(slot%plan.cols)*plan.sw, sy=ARC_TOP+Math.floor(slot/plan.cols)*plan.sh;
    const rx=Math.max(0,plan.sw-ARC_GAP-made.w), ry=Math.max(0,plan.sh-ARC_GAP-made.h);
    const x=sx+ARC_GAP/2+Math.random()*rx, y=sy+ARC_GAP/2+Math.random()*ry;
    const el=h("div","arc-shape");
    el.style.animationDuration=(280*api.tm)+"ms";   // fade-in stretches with the pacing too
    el.style.left=x+"px"; el.style.top=y+"px";
    el.style.width=made.w+"px"; el.style.height=made.h+"px";
    el.appendChild(made.el);
    const rec={el,x:x,y:y,w:made.w,h:made.h,slot:slot,born:played,
               correct:made.correct,blue:made.blue,dead:false};
    el.addEventListener("pointerdown",e=>{ e.stopPropagation(); tap(rec,api,played); });
    stage.appendChild(el);
    shapes.push(rec);
  }
  function tap(rec,api){
    if(!api.running||rec.dead) return;
    rec.dead=true;
    const cx=rec.x+rec.w/2, cy=rec.y+rec.h/2;
    if(rec.correct){
      const got=api.award(arcPoints(api.played-rec.born,api.tm));
      api.pop(cx,cy,"+"+got,"var(--c1)");
      if(rec.blue){ api.addTime(1000*api.tm); api.pop(cx,cy-34,t("bonusSec"),"var(--c2)"); sfxBlue(); }
      else sfxGold();
    }else{
      api.penalise(100);
      api.pop(cx,cy,"-100","var(--red)");
      sfxWrong();
    }
    rec.el.classList.add("hit");
    setTimeout(()=>rec.el.remove(),220);
    shapes=shapes.filter(s=>s!==rec);
  }
  arcadeShell(stage,{
    key:"cube", how:"arcHow",
    rules:[["var(--c1)","ruleGold"],["var(--c3)","ruleBlue"],["var(--red)","ruleWrong"]],
    reset(){ plan=slotPlan(stage); clear(); },
    cleanup(){ clear(); },
    comboPos:"tl",
    frame(dt,played,api){
      const life=ARC_LIFE*api.tm, fade=ARC_FADE*api.tm;
      for(const s of shapes) if(played-s.born>=fade&&!s.el.classList.contains("out")){
        s.el.style.animationDuration=((ARC_LIFE-ARC_FADE)*api.tm)+"ms";
        s.el.classList.add("out");
      }
      const gone=shapes.filter(s=>played-s.born>=life);
      if(gone.length){ gone.forEach(s=>s.el.remove()); shapes=shapes.filter(s=>played-s.born<life); }
      // difficulty ramp on the hidden play clock. `holding` ignores shapes that are
      // already fading, so at level 1 the next appears as the last fades — the hard
      // cap keeps 5 on screen from ever being exceeded.
      const allowed=Math.min(5,1+Math.floor(played/(10000*api.tm)));
      const holding=shapes.filter(s=>played-s.born<fade).length;
      if(holding<allowed && shapes.length<5) spawn(api,played);
    }
  });
}

/* ============================================================
   ARCADE 2 — Angle Lab: stop the sweeping arm on the target

   A line sweeps from the base at 0.5 rev/s (180°/s). Tap when the
   angle matches the target (always a multiple of 15). Dead on is
   1000, less 100 per degree off. Outside the 10° band costs 500.
   On a hit the base jumps to the arm and the sweep reverses.
   ============================================================ */
const ANG_SPEED=144;      // deg per second = 1 revolution every 2.5s
const ANG_SAFE=10;        // the shaded band, half-width in degrees
const ANG_STEP=5;         // one tick mark every 5 degrees, all the same length

function renderAngleArcade(side,stage){
  const svg=document.createElementNS(SVGNS,"svg");
  svg.setAttribute("class","ang-dial");
  stage.appendChild(svg);
  const gDial=document.createElementNS(SVGNS,"g");   // protractor + target band
  const gDyn =document.createElementNS(SVGNS,"g");   // arm and wedge, redrawn each frame
  svg.append(gDial,gDyn);

  const el={};
  const elTgt=h("div","arc-target");
  let base=0, dir=1, sweep=0, target=90, blue=false, geo=null;
  function showTarget(){
    elTgt.textContent=target+"\u00B0";
    elTgt.style.color=blue?"var(--c3)":"var(--c1)";
  }

  const P=(deg,r)=>[geo.cx+r*Math.cos(deg*Math.PI/180), geo.cy-r*Math.sin(deg*Math.PI/180)];
  const ptAt=(a,r)=>P(base+dir*a,r);                 // angle a measured from the base, along the sweep
  const arcTo=(r,a1,large)=>{ const B=ptAt(a1,r);
    return "A"+r+","+r+" 0 "+large+" "+(dir>0?0:1)+" "+B[0].toFixed(2)+","+B[1].toFixed(2); };
  const node=(par,tag,cls)=>{ const e=document.createElementNS(SVGNS,tag);
    if(cls) e.setAttribute("class",cls); par.appendChild(e); return e; };
  const setA=(e,o)=>{ for(const k in o) e.setAttribute(k,o[k]); };
  const clear=g=>{ while(g.firstChild) g.removeChild(g.firstChild); };

  function measure(){
    const W=stage.clientWidth, H=stage.clientHeight;
    geo={W,H,cx:W/2,cy:H/2+14,R:Math.max(70,Math.min(W,H)*0.31)};
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
  }
  function layout(){
    measure();
    clear(gDial); clear(gDyn);
    const R=geo.R;
    for(let a=0;a<360;a+=ANG_STEP){    // one uniform marker every 5 degrees
      const p1=ptAt(a,R*0.93), p2=ptAt(a,R);
      setA(node(gDial,"line","dial-tick"),{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1]});
    }
    const col=blue?"var(--c3)":"var(--c1)", rb=R*0.90;
    const lo=Math.max(0,target-ANG_SAFE), hi=Math.min(360,target+ANG_SAFE);
    const s0=ptAt(lo,rb);
    setA(node(gDial,"path","dial-band"),{fill:col,
      d:"M"+geo.cx+","+geo.cy+" L"+s0[0].toFixed(2)+","+s0[1].toFixed(2)+" "+arcTo(rb,hi,0)+" Z"});
    const tp=ptAt(target,rb);
    setA(node(gDial,"path","dial-target"),{stroke:col,
      d:"M"+geo.cx+","+geo.cy+" L"+tp[0].toFixed(2)+","+tp[1].toFixed(2)});
    const b1=ptAt(0,R*1.14);
    setA(node(gDial,"line","dial-base"),{x1:geo.cx,y1:geo.cy,x2:b1[0],y2:b1[1]});

    el.wedge=node(gDyn,"path","dial-wedge");
    el.ray=node(gDyn,"line","dial-ray");
    el.tip=node(gDyn,"circle","dial-hub"); setA(el.tip,{r:6});
    el.hub=node(gDyn,"circle","dial-hub"); setA(el.hub,{r:7,cx:geo.cx,cy:geo.cy});
    draw();
  }
  function draw(){
    if(!geo||!el.ray) return;
    const R=geo.R, tipP=ptAt(sweep,R*1.14);
    setA(el.ray,{x1:geo.cx,y1:geo.cy,x2:tipP[0],y2:tipP[1]});
    setA(el.tip,{cx:tipP[0],cy:tipP[1]});
    if(sweep>0.6){
      const rw=R*0.55, s0=ptAt(0,rw);
      el.wedge.setAttribute("d","M"+geo.cx+","+geo.cy+" L"+s0[0].toFixed(2)+","+s0[1].toFixed(2)+" "
        +arcTo(rw,sweep,sweep>180?1:0)+" Z");
    } else el.wedge.setAttribute("d","");
  }
  function newTarget(){ return 45+15*Math.floor(Math.random()*10); }   // 45-180, every 15 deg

  /* on a hit the base takes the arm's place and the sweep turns around */
  function nextRound(){
    base=base+dir*sweep;               // the base takes the arm's place
    dir=-dir;                          // and the sweep turns around
    sweep=0;
    target=newTarget();
    blue=Math.random()<0.3;
    showTarget();
    layout();                          // the arm carries straight on, no pause
  }

  observeSize(stage,()=>{ if(geo) layout(); });
  layout();                            // draw the dial behind the title screen

  const api=arcadeShell(stage,{
    key:"ang", how:"arcHowA", topExtra:elTgt, comboPos:"bc",
    rules:[["var(--c1)","ruleAim"],["var(--c3)","ruleBlueA"],["var(--red)","ruleMiss"]],
    reset(){
      base=0; dir=1; sweep=0;
      target=newTarget(); blue=Math.random()<0.3;
      showTarget(); layout();
    },
    cleanup(){},
    frame(dt,played,a){
      sweep+=(ANG_SPEED/a.tm)*dt/1000;   // slower arm on Normal
      if(sweep>=360) sweep-=360;
      draw();
    }
  });

  stage.addEventListener("pointerdown",e=>{
    if(!api.running||e.target.closest("button")) return;
    const dev=Math.abs(sweep-target);
    const x=geo.cx, y=geo.cy-geo.R*0.42;
    if(dev<=ANG_SAFE){
      const got=api.award(Math.max(0,Math.round(1000-100*dev)));
      api.pop(x,y,"+"+got,blue?"var(--c3)":"var(--c1)");
      if(blue){ api.addTime(1000*api.tm); api.pop(x,y-38,t("bonusSec"),"var(--c2)"); sfxBlue(); }
      else sfxGold();
      nextRound();
    }else{
      api.penalise(500);
      api.pop(x,y,"-500","var(--red)");
      sfxWrong();
    }
  });
}

/* ============================================================
   14. FRACTION LAB  —  Cambridge Primary Stage 4

   4Nf.01 more parts -> smaller parts       4Nf.05 add/subtract, same denominator
   4Nf.02 fraction as division              4Nf.06 percentage as parts per hundred
   4Nf.03 unit fractions as operators       4Nf.07 compare and order with =, > and <
   4Nf.04 two proper fractions can be equal
   Proper fractions only — improper fractions and mixed numbers are Stage 5.
   ============================================================ */
const FR_DENOMS=[2,3,4,5,6,8,10,12];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const frKey=(n,d)=>{const g=gcd(n,d);return (n/g)+"/"+(d/g);};
const frEq=(a,b,c,e)=>a*e===c*b;                 // a/b === c/e

/* stacked numerator over denominator */
function frNumeral(n,d,size){
  const el=h("div","fr-num "+(size||"mid"));
  el.append(h("b",null,String(n)),h("i"),h("b",null,String(d)));
  return el;
}
/* a strip cut into d equal parts with n shaded */
function frStrip(n,d,opts){
  opts=opts||{};
  const el=h("div","fr-strip"+(opts.small?" sm":"")+(opts.onCell?"":" locked"));
  for(let i=0;i<d;i++){
    const c=h("div","fr-cell"+(i<n?" on":"")+(opts.blue?" b":""));
    if(opts.onCell) c.onclick=()=>opts.onCell(i);
    el.appendChild(c);
  }
  return el;
}
/* the same fraction as a pie */
function frPie(n,d,size){
  const svg=document.createElementNS(SVGNS,"svg");
  svg.setAttribute("width",size); svg.setAttribute("height",size);
  svg.setAttribute("viewBox","0 0 "+size+" "+size);
  const c=size/2, r=size/2-3;
  const P=a=>[c+r*Math.cos((a-90)*Math.PI/180), c+r*Math.sin((a-90)*Math.PI/180)];
  for(let i=0;i<d;i++){
    const a0=i*360/d, a1=(i+1)*360/d, A=P(a0), B=P(a1);
    const pa=document.createElementNS(SVGNS,"path");
    pa.setAttribute("d","M"+c+","+c+" L"+A[0].toFixed(2)+","+A[1].toFixed(2)+
      " A"+r+","+r+" 0 "+((a1-a0)>180?1:0)+" 1 "+B[0].toFixed(2)+","+B[1].toFixed(2)+" Z");
    pa.setAttribute("fill",i<n?"var(--c1)":"rgba(247,242,231,.13)");
    pa.setAttribute("stroke","var(--mat)"); pa.setAttribute("stroke-width",2);
    svg.appendChild(pa);
  }
  return svg;
}
/* 4Nf.06 — parts in each hundred */
function frGrid(n,d){
  const el=h("div","fr-grid"), lit=Math.round(n/d*100);
  for(let i=0;i<100;i++) el.appendChild(h("span",i<lit?"on":null));
  return el;
}
function frPct(n,d){
  const v=n/d*100, exact=Math.abs(v-Math.round(v))<1e-9;
  return (exact?"":"\u2248")+Math.round(v)+"%";
}
/* every proper fraction with a listed denominator equal to n/d */
function frEquivalents(n,d){
  const out=[];
  for(const e of FR_DENOMS){
    for(let m=1;m<e;m++) if(frEq(n,d,m,e)&&!(m===n&&e===d)) out.push(m+"/"+e);
  }
  return out;
}

/* ---------- tab 1 — Fraction Bench (4Nf.01, .04, .06) ---------- */
function renderBench(side,stage){
  let d=4, n=1;
  const wrap=h("div","fr-wrap bench"), stack=h("div","fr-stack");
  wrap.appendChild(stack); stage.appendChild(wrap);
  const stripBox=h("div",null); stripBox.style.width="100%";
  const row=h("div","fr-row");
  const numBox=h("div"), pieBox=h("div"), gridBox=h("div"), pctBox=h("div","fr-pct");
  row.append(numBox,pieBox,gridBox,pctBox);
  const eq=h("div","fr-eq");
  stack.append(stripBox,row,eq);

  const p1=h("div","panel");
  p1.append(h("h4",null,t("cutter").toUpperCase()));
  const lw=h("div","lever-wrap");
  lw.appendChild(h("div","ticks"));
  const lever=document.createElement("input");
  lever.type="range"; lever.min=0; lever.max=FR_DENOMS.length-1;
  lever.value=FR_DENOMS.indexOf(d); lever.className="lever";
  lever.setAttribute("aria-label",t("cutter"));
  lw.appendChild(lever);
  const ll=h("div","leverlab"); ll.append(h("span",null,t("fewer")),h("span",null,t("more")));
  lw.appendChild(ll); p1.appendChild(lw);
  const cnt=h("p","note"); p1.appendChild(cnt);

  const p2=h("div","panel");
  p2.append(h("h4",null,t("shaded").toUpperCase()));
  const rowb=h("div","rowbtns");
  const bLess=h("button","btn alt","\u2212"), bMore=h("button","btn alt","+");
  rowb.append(bLess,bMore); p2.appendChild(rowb);
  p2.appendChild(Object.assign(h("p","note",t("benchHelp")),{}));
  side.append(p1,p2);

  lever.oninput=()=>{ d=FR_DENOMS[+lever.value]; if(n>d) n=d; draw(); };
  bLess.onclick=()=>{ n=Math.max(0,n-1); draw(); };
  bMore.onclick=()=>{ n=Math.min(d,n+1); draw(); };

  function draw(){
    stripBox.innerHTML=""; numBox.innerHTML=""; pieBox.innerHTML=""; gridBox.innerHTML="";
    stripBox.appendChild(frStrip(n,d,{onCell:i=>{ n=(i<n)?i:i+1; draw(); }}));
    numBox.appendChild(frNumeral(n,d,"big"));
    pieBox.appendChild(frPie(n,d,132));
    gridBox.appendChild(frGrid(n,d));
    pctBox.textContent=frPct(n,d);
    const e=frEquivalents(n,d);
    eq.textContent=e.length ? t("equiv").toUpperCase()+"  "+e.join("   ") : "";
    cnt.textContent=t("parts")+": "+d;
  }
  draw();
}

/* ---------- tab 2 — Compare it (4Nf.07, .01) ---------- */
function renderCompare(side,stage){
  foldlessHud(stage);
  const q=hudQuestion(stage,t("qCmp"));
  const score=hudScore(stage);
  const act=hudActions(stage);
  const wrap=h("div","fr-wrap"), stack=h("div","fr-stack");
  wrap.appendChild(stack); stage.appendChild(wrap);
  const top=h("div","fr-row"), sym=h("div","fr-sym","?");
  const aBox=h("div"), bBox=h("div");
  top.append(aBox,sym,bBox);
  stack.appendChild(top);
  let A=[1,2],B=[1,3],answered=false;
  ["<","=",">"].forEach(k=>{
    const b=h("button","abtn",k); b.style.fontSize="24px";
    b.onclick=()=>answer(k); act.appendChild(b);
  });

  function pick(){
    for(let tries=0;tries<50;tries++){
      const r=Math.random();
      let X,Y;
      if(r<0.45){                       // the trap: same numerator, different denominator
        const n=1+Math.floor(Math.random()*2);
        const d1=rand(FR_DENOMS), d2=rand(FR_DENOMS);
        if(d1===d2) continue;
        X=[Math.min(n,d1-1)||1,d1]; Y=[Math.min(n,d2-1)||1,d2];
      }else if(r<0.75){                 // same denominator, different numerators
        const d=rand(FR_DENOMS.filter(x=>x>2));
        const a=1+Math.floor(Math.random()*(d-1));
        const b=1+Math.floor(Math.random()*(d-1));
        if(a===b) continue;             // 3/4 against 3/4 asks nothing
        X=[a,d]; Y=[b,d];
      }else{                            // equal in value, written differently -> the "=" answer
        const d1=rand([2,3,4,5,6]), k=rand([2,3]);
        if(d1*k>12) continue;
        const n1=1+Math.floor(Math.random()*(d1-1));
        X=[n1,d1]; Y=[n1*k,d1*k];
        if(Math.random()<0.5){ const t=X; X=Y; Y=t; }
      }
      if(X[0]===Y[0]&&X[1]===Y[1]) continue;      // never the very same fraction twice
      return [X,Y];
    }
    return [[1,2],[1,3]];
  }
  function deal(){
    answered=false; act.hidden=false; sym.textContent="?"; sym.style.color="";
    [A,B]=pick();
    aBox.innerHTML=""; bBox.innerHTML="";
    aBox.appendChild(frNumeral(A[0],A[1],"big"));
    bBox.appendChild(frNumeral(B[0],B[1],"big"));
  }
  function answer(said){
    if(answered) return; answered=true;
    const va=A[0]/A[1], vb=B[0]/B[1];
    const truth = Math.abs(va-vb)<1e-9 ? "=" : va<vb ? "<" : ">";
    const ok=said===truth;
    act.hidden=true; sym.textContent=truth; sym.style.color=ok?"var(--c2)":"var(--red)";
    score.hit(ok);
    if(ok) scraps(stage);
    // the strips ride inside the message, so nothing covers the proof
    const proof=h("div","fr-stack");
    proof.style.margin="0 auto";
    [[A,false],[B,true]].forEach(([F,blue])=>{
      const row=h("div","fr-row"); row.style.width="100%"; row.style.gap="12px";
      const lab=frNumeral(F[0],F[1],"mid"); lab.style.minWidth="1.9em";
      const st=frStrip(F[0],F[1],{small:true,blue:blue});
      st.style.flex="1"; st.style.width="auto"; st.style.maxWidth="none";
      row.append(lab,st); proof.appendChild(row);
    });
    const why=t("cmpWhy")(A[0]+"/"+A[1],B[0]+"/"+B[1],truth)+
      (A[0]===B[0]&&A[1]!==B[1] ? " "+t("smallerWhy") : "");
    celebrate(stage,ok,why,deal,t("nextQ"),proof);
  }
  deal();
}

/* ---------- tab 3 — Fraction of (4Nf.02, .03) ---------- */
const FR_ICONS=["\u{1F34E}","\u2B50","\u{1F36A}","\u{1F388}","\u{1F41F}","\u{1F338}",
                "\u{1F697}","\u{1F353}","\u{1F9C1}","\u26BD","\u{1F431}","\u{1F344}"];

/* Lay the whole set out as a grid whose rows (or columns) ARE the equal groups:
   12 as 3 groups of 4 becomes 4x3, 12 as 6 groups of 2 becomes 6x2, 18 as 6
   groups of 3 becomes 6x3. Whichever of d and per is larger goes across, so the
   picture stays wide rather than tall. Group index is always floor(i / per). */
function frSetView(whole,d,per,kind,box){
  const items=[];
  const availW=Math.max(220,box.w), availH=Math.max(180,box.h);

  if(kind==="pie"){
    const size=Math.max(160,Math.min(availW,availH,460));
    const svg=document.createElementNS(SVGNS,"svg");
    svg.setAttribute("width",size); svg.setAttribute("height",size);
    svg.setAttribute("viewBox","0 0 "+size+" "+size);
    svg.style.pointerEvents="auto";
    const c=size/2, r=size/2-4;
    const P=a=>[c+r*Math.cos((a-90)*Math.PI/180), c+r*Math.sin((a-90)*Math.PI/180)];
    for(let i=0;i<whole;i++){
      const a0=i*360/whole, a1=(i+1)*360/whole, A=P(a0), B=P(a1);
      const pa=document.createElementNS(SVGNS,"path");
      pa.setAttribute("class","fr-slice");
      pa.setAttribute("d","M"+c+","+c+" L"+A[0].toFixed(2)+","+A[1].toFixed(2)+
        " A"+r+","+r+" 0 "+((a1-a0)>180?1:0)+" 1 "+B[0].toFixed(2)+","+B[1].toFixed(2)+" Z");
      svg.appendChild(pa); items.push(pa);
    }
    return {box:svg,items:items};
  }

  const across = d>=per;                       // put the bigger count horizontally
  const cols = across ? d : per;
  const rows = across ? per : d;
  const gap  = kind==="bar" ? 0 : Math.max(4,Math.min(14,Math.round(availW/(cols*9))));
  const cell = Math.max(20, Math.min(96,
    Math.floor(Math.min((availW-gap*(cols-1))/cols, (availH-gap*(rows-1))/rows))));

  const el=h("div","fr-grid-set");
  el.style.gap=gap+"px";
  el.style.gridTemplateColumns="repeat("+cols+","+cell+"px)";
  el.style.gridTemplateRows="repeat("+rows+","+cell+"px)";
  if(across) el.style.gridAutoFlow="column";   // fill down each column: column = group
  if(kind==="bar"){ el.style.borderRadius="10px"; el.style.overflow="hidden"; }

  const icon=rand(FR_ICONS);
  for(let i=0;i<whole;i++){
    let it;
    if(kind==="icons"){
      it=h("div","fr-ico",icon);
      it.style.fontSize=Math.round(cell*0.78)+"px";
    }else if(kind==="bar"){
      it=h("div","fr-barcell");
    }else{
      it=h("div",(kind==="squares"?"fr-sq":"fr-dot")+" fr-item");
      it.style.width=cell+"px"; it.style.height=cell+"px";
      if(kind==="squares") it.style.borderRadius=Math.round(cell*0.22)+"px";
    }
    el.appendChild(it); items.push(it);
  }
  return {box:el,items:items};
}

function renderFractionOf(side,stage){
  foldlessHud(stage);
  const score=hudScore(stage);
  const act=hudActions(stage);
  const qEl=h("div","fr-q"); stage.appendChild(qEl);
  const viz=h("div");
  viz.style.cssText="position:absolute;left:0;right:0;top:120px;bottom:104px;"+
                    "display:grid;place-items:center;pointer-events:none";
  stage.appendChild(viz);

  let n=1,d=3,whole=12,per=4,ans=4,answered=false,items=[],kind="dots";

  const preview=v=>{ items.forEach((el,i)=>el.classList.toggle("pre",!answered&&i<v)); };
  const space=()=>({w:stage.clientWidth-70, h:viz.clientHeight-24});

  function paintSet(){
    const view=frSetView(whole,d,per,kind,space());
    viz.innerHTML=""; viz.appendChild(view.box);
    items=view.items;
    items.forEach((el,i)=>{
      el.addEventListener("pointerenter",()=>preview(i+1));
      el.addEventListener("pointerleave",()=>preview(0));
      el.addEventListener("click",()=>answer(i+1));   // tap the picture itself
    });
    if(answered) markAnswer();
  }
  function markAnswer(){
    items.forEach((el,i)=>{
      el.classList.remove("pre");
      el.classList.toggle("on",i<ans);
      if(Math.floor(i/per)%2===0) el.classList.add("grp");   // band the equal groups
    });
  }
  observeSize(stage,()=>{ if(items.length) paintSet(); });

  function deal(){
    answered=false; act.hidden=false; act.innerHTML="";
    d=rand([2,3,4,5,6]);
    per=2+Math.floor(Math.random()*3);                 // 2-4 in each group
    whole=d*per;
    n=Math.random()<0.65?1:1+Math.floor(Math.random()*(d-1));   // unit fractions mostly
    ans=per*n;
    const kinds=["dots","squares","icons","bar","icons"];       // icons twice: kids like them
    if(whole<=12) kinds.push("pie");
    kind=rand(kinds);

    qEl.innerHTML="";
    qEl.append(frNumeral(n,d,"big"),
               h("span",null,t("ofWord")),
               h("span",null,String(whole)),
               h("span",null,"= ?"));
    paintSet();

    pickOptions(ans,1,whole,4,4).forEach(v=>{
      const b=h("button","abtn",String(v));
      b.addEventListener("pointerenter",()=>preview(v));
      b.addEventListener("pointerleave",()=>preview(0));
      b.onclick=()=>answer(v);
      act.appendChild(b);
    });
  }
  function answer(said){
    if(answered) return; answered=true;
    const ok=said===ans;
    act.hidden=true;
    markAnswer();
    score.hit(ok);
    if(ok) scraps(stage);
    celebrate(stage,ok,t("ofWhy")(n,d,whole,ans),deal,t("nextQ"));
  }
  deal();
}

/* ---------- tab 4 — Add & take away (4Nf.05) ---------- */
/* One bar. The part that stays sits solid; the part being added (gold) or taken
   away (blue) pulses beside it. The whole shaded run is bracketed above with the
   larger fraction, and each part is bracketed below with its own. */
function frWorkBar(d,keep,move,blue,topN){
  const total=keep+move;
  const g=h("div","fr-work");
  g.style.gridTemplateColumns="repeat("+d+",1fr)";

  const top=h("div","fr-lab");
  top.style.gridRow="1"; top.style.gridColumn="1 / "+(total+1);
  top.append(frNumeral(topN,d,"mid"),h("div","fr-brace down"));
  g.appendChild(top);

  for(let i=0;i<d;i++){
    const solid=i<keep, pulse=i>=keep&&i<total;
    const c=h("div","fr-wcell"+(solid?" on":"")+(pulse?" blink"+(blue?" b":""):"")+(i===d-1?" end":""));
    c.style.gridRow="2"; c.style.gridColumn=(i+1)+" / "+(i+2);
    if(i===0)   c.style.borderRadius="9px 0 0 9px";
    if(i===d-1) c.style.borderRadius="0 9px 9px 0";
    g.appendChild(c);
  }
  const bot=(from,to,num,cls)=>{
    if(to<=from) return;
    const el=h("div","fr-lab");
    el.style.gridRow="3"; el.style.gridColumn=(from+1)+" / "+(to+1);
    el.append(h("div","fr-brace up "+cls),frNumeral(num,d,"mid"));
    g.appendChild(el);
  };
  bot(0,keep,keep,"gold");
  bot(keep,total,move,blue?"blue":"gold");
  return g;
}
function renderAddSub(side,stage){
  foldlessHud(stage);
  hudQuestion(stage,t("qAdd"));
  const score=hudScore(stage);
  const act=hudActions(stage);
  const wrap=h("div","fr-wrap"), stack=h("div","fr-stack");
  wrap.appendChild(stack); stage.appendChild(wrap);
  const line=h("div","fr-row"); stack.appendChild(line);
  let a=1,b=1,d=4,plus=true,ans=2,answered=false;

  function deal(){
    answered=false; act.hidden=false; act.innerHTML="";
    d=rand([4,5,6,8,10]);
    plus=Math.random()<0.6;
    if(plus){ a=1+Math.floor(Math.random()*(d-2)); b=1+Math.floor(Math.random()*(d-a-1)); ans=a+b; }
    else { a=2+Math.floor(Math.random()*(d-2)); b=1+Math.floor(Math.random()*(a-1)); ans=a-b; }
    line.innerHTML="";
    line.append(frNumeral(a,d,"big"),h("div","fr-op",plus?"+":"\u2212"),
                frNumeral(b,d,"big"),h("div","fr-op","="),h("div","fr-sym","?"));
    pickOptions(ans,1,d-1,Math.min(4,d-1),3).forEach(v=>{
      const btn=h("button","abtn"); btn.appendChild(frNumeral(v,d,"mid"));
      btn.onclick=()=>answer(v); act.appendChild(btn);
    });
  }
  function answer(said){
    if(answered) return; answered=true;
    const ok=said===ans;
    act.hidden=true;
    line.lastChild.textContent=ans+"/"+d;
    line.lastChild.style.color=ok?"var(--c2)":"var(--red)";
    score.hit(ok);
    if(ok) scraps(stage);
    // adding: a stays, b joins it, a+b is the total bracketed on top
    // taking away: ans stays, b is the piece leaving, a is the total on top
    const keep = plus ? a : ans;
    const proof = frWorkBar(d, keep, b, !plus, plus ? ans : a);
    celebrate(stage,ok,t("addWhy")(a+"/"+d,plus?"+":"\u2212",b+"/"+d,ans+"/"+d),
              deal,t("nextQ"),proof);
  }
  deal();
}

/* ============================================================
   15. FRACTION RUN — three-lane endless runner
   Gates carry three candidate answers; steer into the right lane.
   Right: +100 (times combo) and +1s. Wrong: -200, combo resets.
   Every gate crossed makes the runner 5% faster.
   ============================================================ */
/* Speed is expressed as a cadence, not pixels per second: one gate every
   RUN_GATE_SECS at the starting pace. Deriving px/s from the actual road height
   keeps that cadence identical on a phone and on a wide monitor — a fixed px/s
   ran slower on tall screens and faster on short ones. */
const RUN_GATE_SECS=2.0; // seconds per gate on Normal before any speed-ups
const RUN_HARD=1.5;      // Hard runs 50% faster
const RUN_BOOST=1.7;     // while the up arrow is held
const RUN_STEP=1.05;     // per gate crossed
const RUN_CAP=2.6;       // otherwise it outruns any child
const RUN_GATE_H=94;
const RUN_TARGETS=[[1,2],[1,3],[1,4],[2,3],[3,4],[1,5],[2,5],[1,6],[3,10]];
const FR_POOL=(()=>{ const o=[];
  for(const d of FR_DENOMS) for(let n=1;n<d;n++) o.push({t:"frac",n:n,d:d}); return o; })();
const frVal=s=> s.t==="frac" ? s.n/s.d : s.t==="pct" ? s.v/100 : s.v;
const frShuffle=a=>{ for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; };
/* pick `count` fractions matching pred, all different in value from each other
   and from anything already used. Filter + shuffle, never a rejection loop. */
function sampleFr(pred,count,used){
  const cand=frShuffle(FR_POOL.filter(pred));
  const out=[];
  for(const f of cand){
    if(out.length>=count) break;
    const v=frVal(f);
    if(used.some(u=>Math.abs(frVal(u)-v)<1e-9)) continue;
    if(out.some(o=>Math.abs(frVal(o)-v)<1e-9)) continue;
    out.push(f);
  }
  return out;
}
function runAnsNode(sp){
  if(sp.t==="frac") return frNumeral(sp.n,sp.d,"mid");
  return h("div","run-val", sp.t==="pct" ? sp.v+"%" : String(sp.v));
}
function runCompareQ(kind){
  const tgt=rand(RUN_TARGETS), tn=tgt[0], td=tgt[1], tv=tn/td;
  let correct=null, wrongs=[];
  if(kind==="eq"){
    const forms=[];
    for(const k of [2,3,4]) if(td*k<=12) forms.push({t:"frac",n:tn*k,d:td*k});
    if((100*tn/td)%1===0) forms.push({t:"pct",v:Math.round(100*tn/td)});
    if(!forms.length) return null;
    correct=rand(forms);
    wrongs=sampleFr(f=>Math.abs(f.n/f.d-tv)>1e-9,2,[correct]);
  }else{
    const up=kind==="gt";
    const c=sampleFr(f=> up ? f.n/f.d>tv+1e-9 : f.n/f.d<tv-1e-9, 1, []);
    if(!c.length) return null;
    correct=c[0];
    wrongs=sampleFr(f=> up ? f.n/f.d<tv-1e-9 : f.n/f.d>tv+1e-9, 2, [correct]);
  }
  if(wrongs.length<2) return null;
  const opts=frShuffle([correct].concat(wrongs));
  const node=h("div","run-q");
  node.append(h("span",null,t(kind==="eq"?"qEq":kind==="gt"?"qGt":"qLt")),frNumeral(tn,td,"mid"));
  return {node:node,opts:opts,correct:opts.indexOf(correct)};
}
function runAddQ(plus){
  const d=rand([4,5,6,8,10]);
  let a,b;
  if(plus){ a=1+Math.floor(Math.random()*(d-2)); b=1+Math.floor(Math.random()*(d-a-1)); }
  else    { a=2+Math.floor(Math.random()*(d-2)); b=1+Math.floor(Math.random()*(a-1)); }
  const ans=plus?a+b:a-b;
  const opts=frShuffle(pickOptions(ans,1,d-1,Math.min(3,d-1),3).map(v=>({t:"frac",n:v,d:d})));
  const node=h("div","run-q");
  node.append(frNumeral(a,d,"mid"),h("span",null,plus?"+":"\u2212"),
              frNumeral(b,d,"mid"),h("span",null,"=?"));
  let ci=0; opts.forEach((o,i)=>{ if(o.n===ans) ci=i; });
  return {node:node,opts:opts,correct:ci};
}
function runOfQ(){
  const d=rand([2,3,4,5,6]), per=2+Math.floor(Math.random()*3), whole=d*per;
  const n=Math.random()<0.7?1:1+Math.floor(Math.random()*(d-1));
  const ans=per*n;
  const opts=frShuffle(pickOptions(ans,1,whole,3,4).map(v=>({t:"num",v:v})));
  const node=h("div","run-q");
  node.append(frNumeral(n,d,"mid"),h("span",null,t("ofWord")),
              h("span",null,String(whole)),h("span",null,"=?"));
  let ci=0; opts.forEach((o,i)=>{ if(o.v===ans) ci=i; });
  return {node:node,opts:opts,correct:ci};
}
function runQuestion(){
  for(let tries=0;tries<30;tries++){
    const k=rand(["eq","gt","lt","add","sub","of"]);
    const q = (k==="eq"||k==="gt"||k==="lt") ? runCompareQ(k)
            : (k==="add"||k==="sub") ? runAddQ(k==="add")
            : runOfQ();
    if(q) return q;
  }
  return runAddQ(true);                       // always succeeds
}

function renderRunArcade(side,stage){
  const road=h("div","run-road");
  const l1=h("div","run-line"), l2=h("div","run-line");
  l1.style.left="33.3333%"; l2.style.left="66.6666%";
  const gates=h("div","run-gates");
  const runner=h("div","run-runner");
  const dart=document.createElementNS(SVGNS,"svg");
  dart.setAttribute("viewBox","0 0 60 60");
  dart.setAttribute("width","52"); dart.setAttribute("height","52");
  const dp=document.createElementNS(SVGNS,"path");
  dp.setAttribute("d","M30 5 L53 51 L30 39 L7 51 Z");
  dp.setAttribute("fill","var(--c1)"); dp.setAttribute("stroke","#fff");
  dp.setAttribute("stroke-width","3.5"); dp.setAttribute("stroke-linejoin","round");
  dart.appendChild(dp); runner.appendChild(dart);
  road.append(l1,l2,gates,runner);
  stage.appendChild(road);

  const ctrl=h("div","run-ctrl");
  const bl=h("button","run-arrow","\u25C0"),
        bu=h("button","run-arrow","\u25B2"),
        br=h("button","run-arrow","\u25B6");
  ctrl.append(bl,bu,br); stage.appendChild(ctrl);

  let lane=1, mult=1, scroll=0, live=[], apiRef=null, boost=false;
  const setLane=v=>{ lane=Math.max(0,Math.min(2,v)); runner.style.left=(lane*33.3333)+"%"; };
  const nudge=dir=>{ if(apiRef&&apiRef.running) setLane(lane+dir); };
  bl.onclick=()=>nudge(-1);
  br.onclick=()=>nudge(1);
  road.addEventListener("pointerdown",e=>{            // tapping a lane also works
    if(!apiRef||!apiRef.running) return;
    const r=road.getBoundingClientRect();
    setLane(Math.floor((e.clientX-r.left)/(r.width/3)));
  });
  const setBoost=on=>{ boost=on; runner.classList.toggle("boost",on); };
  bu.addEventListener("pointerdown",e=>{ e.preventDefault(); setBoost(true); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>
    bu.addEventListener(ev,()=>setBoost(false)));
  const onKey=e=>{
    if(e.key==="ArrowLeft"){ e.preventDefault(); nudge(-1); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); nudge(1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); setBoost(true); }
  };
  const offKey=e=>{ if(e.key==="ArrowUp") setBoost(false); };
  const blur=()=>setBoost(false);              // never leave the dash stuck on
  window.addEventListener("keydown",onKey);
  window.addEventListener("keyup",offKey);
  window.addEventListener("blur",blur);
  pending.push(()=>{
    window.removeEventListener("keydown",onKey);
    window.removeEventListener("keyup",offKey);
    window.removeEventListener("blur",blur);
  });

  function clearGates(){ live.forEach(g=>g.el.remove()); live=[]; }
  function spawn(){
    const q=runQuestion();
    const el=h("div","run-group");
    const qbar=h("div","run-qbar");            // the question rides with its gates
    qbar.appendChild(q.node);
    el.appendChild(qbar);
    const cells=[];
    q.opts.forEach((sp,i)=>{
      const g=h("div","run-gate");
      g.style.left=(i*33.3333)+"%";
      const inner=h("div","run-gate-in");
      inner.appendChild(runAnsNode(sp));
      g.appendChild(inner); el.appendChild(g); cells.push(g);
    });
    gates.appendChild(el);
    live.push({el:el,y:-RUN_GATE_H,correct:q.correct,cells:cells,done:false});
  }
  function resolve(g,api){
    g.done=true;
    const ok=lane===g.correct;
    g.cells[g.correct].classList.add("good");
    if(!ok) g.cells[lane].classList.add("bad");
    const rr=road.getBoundingClientRect(), sr=stage.getBoundingClientRect();
    const px=rr.left-sr.left+rr.width*(lane*0.33333+0.1667);
    const py=rr.top-sr.top+rr.height-120;
    if(ok){
      const got=api.award(100);
      api.addTime(1000*api.tm);
      api.pop(px,py,"+"+got,"var(--c2)");
      sfxGold();
    }else{
      api.penalise(200);
      api.pop(px,py,"-200","var(--red)");
      sfxWrong();
    }
    mult=Math.min(RUN_CAP,mult*RUN_STEP);     // every gate crossed, right or wrong
    spawn();
  }

  arcadeShell(stage,{
    key:"run", how:"arcHowR", comboPos:"tl",
    rules:[["var(--c2)","ruleRunGood"],["var(--red)","ruleRunBad"],
           ["var(--c1)","ruleRunFast"],["var(--chalk)","ruleRunBoost"]],
    reset(api){ apiRef=api; mult=1; scroll=0; setBoost(false); clearGates(); setLane(1); spawn(); },
    cleanup(){ clearGates(); },
    frame(dt,played,api){
      apiRef=api;
      const H=road.clientHeight||420;
      const hitY=H-86;                          // where the runner sits
      // distance a gate covers between spawning and reaching the runner
      const travel=H-39;
      const base=travel/RUN_GATE_SECS*(api.hard?RUN_HARD:1);
      const step=base*mult*(boost?RUN_BOOST:1)*dt/1000;
      scroll+=step;
      l1.style.backgroundPositionY=scroll+"px";
      l2.style.backgroundPositionY=scroll+"px";
      for(const g of live){
        g.y+=step;
        g.el.style.transform="translateY("+g.y.toFixed(1)+"px)";
        if(!g.done && g.y+RUN_GATE_H/2>=hitY) resolve(g,api);
      }
      const gone=live.filter(g=>g.y>H+20);
      if(gone.length){ gone.forEach(g=>g.el.remove()); live=live.filter(g=>g.y<=H+20); }
    }
  });
}

/* the fraction quizzes use the full-bleed HUD but no 3D stage */
function foldlessHud(stage){ stage.classList.add("pickmode"); }

/* ---------- go ---------- */
render();
</script>
