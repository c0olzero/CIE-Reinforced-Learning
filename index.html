<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench — mini-games for curious kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --mat:#1E3A35; --mat2:#27524A; --matline:rgba(223,233,227,.09); --matline2:rgba(223,233,227,.16);
  --paper:#F7F2E7; --paper2:#EDE5D4; --ink:#16241F; --chalk:#DFE9E3; --chalk-dim:#9DB3AB;
  --amber:#F0A63C; --red:#E2563F;
  --c0:#E2563F; --c1:#F0A63C; --c2:#3FB8A0; --c3:#4C8FD1; --c4:#9B6BB5; --c5:#7FB550;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--body); color:var(--chalk); background:var(--mat);
  background-image:
    linear-gradient(var(--matline) 1px,transparent 1px),
    linear-gradient(90deg,var(--matline) 1px,transparent 1px),
    linear-gradient(var(--matline2) 1px,transparent 1px),
    linear-gradient(90deg,var(--matline2) 1px,transparent 1px),
    radial-gradient(120% 90% at 50% 0%, var(--mat2), var(--mat) 70%);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px,100% 100%;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}

/* ---------- shell ---------- */
.shell{max-width:1440px;margin:0 auto;padding:14px 20px 16px;height:100%;height:100dvh;
  display:flex;flex-direction:column}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.hub{flex:1;min-height:0;overflow-y:auto;padding-bottom:20px}
.bar{display:flex;align-items:center;gap:14px;padding:2px 0 16px;flex:none}
.mark{width:34px;height:34px;flex:none;position:relative}
.mark i{position:absolute;inset:0;border:2.5px solid var(--chalk);border-radius:4px;transform:rotate(-8deg)}
.mark i:last-child{border-style:dashed;border-color:var(--amber);transform:rotate(14deg) scale(.72)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--chalk-dim);letter-spacing:.02em;margin-top:3px}
.bar .spacer{flex:1}
.chip{border:1.5px solid rgba(223,233,227,.28);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:500;transition:.15s}
.chip:hover{border-color:var(--amber);color:var(--amber)}
.chip.ghost{border-style:dashed}

/* ---------- hub ---------- */
.lede{font-family:var(--display);font-weight:600;font-size:clamp(26px,5vw,40px);line-height:1.06;letter-spacing:-.03em;max-width:16ch;margin-bottom:8px}
.lede em{font-style:normal;color:var(--amber)}
.sub{color:var(--chalk-dim);font-size:14.5px;max-width:44ch;margin-bottom:26px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:16px 16px 14px;text-align:left;position:relative;overflow:hidden;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.55);transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s}
.card:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 18px 32px -14px rgba(0,0,0,.6)}
.card .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:#8A9A8F;display:block;margin-bottom:36px}
.card h3{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;margin-bottom:5px}
.card p{font-size:13px;line-height:1.45;color:#4E5F58}
.card .strip{position:absolute;top:0;left:0;right:0;height:9px;display:flex}
.card .strip span{flex:1}
.card.soon{background:transparent;color:var(--chalk-dim);border:1.5px dashed rgba(223,233,227,.24);box-shadow:none;cursor:default}
.card.soon:hover{transform:none}
.card.soon h3{color:var(--chalk);font-size:17px}
.card.soon p{color:var(--chalk-dim)}
.card.soon .tag{color:var(--chalk-dim);margin-bottom:26px}

/* ---------- module ---------- */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;flex:none}
.tab{border:1.5px solid rgba(223,233,227,.22);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;transition:.15s}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:700}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:stretch;flex:1;min-height:0}
.side{min-height:0;overflow-y:auto;scrollbar-width:thin}

.stage{position:relative;height:100%;min-height:240px;border-radius:var(--r);overflow:hidden;
  background:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px),
    radial-gradient(80% 70% at 50% 32%, #2C5B52, #1B342F 78%);
  background-size:26px 26px,26px 26px,100% 100%;
  border:1.5px solid rgba(223,233,227,.14);
  perspective:1400px;perspective-origin:50% 46%;
  touch-action:none;cursor:grab;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage:active{cursor:grabbing}
.world{position:absolute;inset:0;transform-style:preserve-3d}
.netwrap{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.face{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.face > svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.face > svg polygon{stroke:rgba(22,36,31,.34);stroke-width:2;stroke-linejoin:round;pointer-events:auto}
.face.tappable > svg polygon{cursor:pointer}
.face.tappable:hover > svg polygon{stroke:#fff;stroke-width:5}
.face.pick > svg polygon{stroke:#fff;stroke-width:6}
.face.clash > svg polygon{animation:clash .9s infinite}
@keyframes clash{0%,100%{stroke:rgba(255,255,255,.3);stroke-width:3}50%{stroke:#fff;stroke-width:7}}
.lab-num{position:absolute;font-family:var(--display);font-weight:800;color:rgba(22,36,31,.6);
  backface-visibility:hidden;pointer-events:none;white-space:nowrap;line-height:1}
.face.star > .lab-num{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.crease{fill:none;stroke:rgba(22,36,31,.6);stroke-width:2;stroke-dasharray:6 5;pointer-events:none}
.hint{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:rgba(223,233,227,.4);pointer-events:none}
.reset{position:absolute;right:10px;top:10px;font-size:11.5px;padding:6px 11px;border:1.5px solid rgba(223,233,227,.2);border-radius:999px;color:var(--chalk-dim)}
.reset:hover{color:var(--amber);border-color:var(--amber)}

/* ---------- panel ---------- */
.panel{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:16px;box-shadow:0 12px 28px -16px rgba(0,0,0,.6)}
.panel h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:#8A9A8F;margin-bottom:10px}
.panel + .panel{margin-top:12px}
.rowbtns{display:flex;gap:8px}
.btn{flex:1;background:var(--ink);color:var(--paper);border-radius:10px;padding:11px 12px;font-size:13.5px;font-weight:700;transition:.15s}
.btn:hover{background:#2B4239}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid rgba(22,36,31,.25)}
.btn.alt:hover{background:rgba(22,36,31,.06)}
.btn.big{padding:15px 12px;font-size:15px}
.btn.yes{background:#2F7D5F}.btn.yes:hover{background:#37916E}
.btn.no{background:#B4432F}.btn.no:hover{background:#C74E38}
.btn[disabled]{opacity:.4;pointer-events:none}

/* shape picker */
.shapes{display:flex;flex-wrap:wrap;gap:6px}
.shape{border:1.5px solid rgba(22,36,31,.2);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--ink);transition:.15s}
.shape:hover{border-color:var(--ink)}
.shape[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}

/* fold lever — the signature control */
.lever-wrap{padding:2px 2px 0}
.ticks{height:12px;margin:0 15px;
  background-image:repeating-linear-gradient(90deg,rgba(22,36,31,.45) 0 1.5px,transparent 1.5px 10%);
  border-bottom:1.5px solid rgba(22,36,31,.3)}
.lever{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin-top:-3px}
.lever::-webkit-slider-runnable-track{height:10px;border-radius:2px;background:linear-gradient(90deg,var(--paper2),#D8CDB6);border:1.5px solid rgba(22,36,31,.3)}
.lever::-moz-range-track{height:10px;border-radius:2px;background:linear-gradient(90deg,var(--paper2),#D8CDB6);border:1.5px solid rgba(22,36,31,.3)}
.lever::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:32px;margin-top:-13px;border-radius:5px;
  background:var(--amber);border:2px solid var(--ink);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14);cursor:grab}
.lever::-moz-range-thumb{width:26px;height:32px;border-radius:5px;background:var(--amber);border:2px solid var(--ink);cursor:grab}
.leverlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#8A9A8F;margin-top:8px}

/* net picker */
.strip-nets{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px}
.thumb{aspect-ratio:1;border:1.5px solid rgba(22,36,31,.18);border-radius:8px;padding:4px;display:grid;place-items:center;background:#fff;transition:.15s}
.thumb:hover{border-color:var(--ink)}
.thumb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2.5px var(--amber)}
.thumb svg{width:100%;height:100%;display:block}
.thumb polygon{fill:rgba(22,36,31,.72);stroke:#fff;stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}

/* quiz */
.q{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.25;letter-spacing:-.01em;margin-bottom:12px}
.note{font-size:12px;color:#4E5F58;margin-top:11px;line-height:1.45}
.verdict{border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.45;margin-bottom:12px}
.verdict.ok{background:#DDEDE1;color:#1E4A34}
.verdict.bad{background:#F6DFD9;color:#7A2E1D}
.verdict b{display:block;font-family:var(--display);font-size:15px;margin-bottom:2px}
.score{display:flex;gap:18px;font-size:12.5px;color:#4E5F58}
.score b{font-family:var(--display);font-size:20px;color:var(--ink);display:block;line-height:1}
.scrap{position:absolute;width:9px;height:12px;pointer-events:none;z-index:5}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

/* ---------- responsive ---------- */
@media(max-width:900px){ .lab{grid-template-columns:minmax(0,1fr) 280px} }
@media(max-width:820px){
  body{overflow:auto}
  .shell{height:auto;min-height:100dvh;padding:12px 14px 20px}
  #main{display:block}
  .lab{display:block}
  .stage{height:48vh;min-height:280px;margin-bottom:14px}
  .side{overflow:visible}
  .brand small{display:none}
}
@media(max-width:420px){
  .stage{height:42vh;min-height:250px}
  .btn.big{padding:13px 10px;font-size:14px}
  .cards{grid-template-columns:1fr 1fr}
  .card .tag{margin-bottom:22px}
}
@media(max-height:560px) and (min-width:821px){ .bar{padding-bottom:10px} .lede{font-size:26px} }
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <div class="mark"><i></i><i></i></div>
    <div class="brand" id="brand">Workbench<small id="tagline">mini-games for curious kids</small></div>
    <div class="spacer"></div>
    <button class="chip ghost" id="backBtn" hidden>← <span>Back</span></button>
    <button class="chip" id="langBtn">Tiếng Việt</button>
  </div>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   WORKBENCH — a standalone, modular learning game.
   One file. No dependencies. Open it anywhere.

   To add a module later, drop an entry into MODULES below and
   write a render function for each of its games. The shell,
   language toggle and routing handle the rest.
   ============================================================ */

/* ---------- 1. strings ---------- */
const T = {
  en:{
    brand:"Workbench", tagline:"mini-games for curious kids", back:"Back", lang:"Tiếng Việt",
    lede:["Learn by ","making a mess"," of it."],
    sub:"Pick a workshop. Each one holds a few small games that only work if you actually understand the idea.",
    soon:"in the workshop",
    modCube:"Solid Lab", modCubeP:"Flatten a solid into paper — then fold it back up.",
    modTimes:"Times Tables", modTimesP:"Coming next.",
    modFrac:"Fractions", modFracP:"Coming next.",
    modClock:"Telling Time", modClockP:"Coming next.",
    gFold:"Fold Lab", gNet:"Folds or not?", gOpp:"Opposite sides",
    gFoldP:"Unfold five different solids.", gNetP:"Does this paper make a cube?", gOppP:"Which square lands across?",
    shape:"Shape", pattern:"Pattern", fold:"Fold", flat:"FLAT", solid:"SOLID",
    foldIt:"Fold it up", flatten:"Flatten it", drag:"DRAG THE MAT TO LOOK AROUND", reset:"Reset view",
    nets:"Nets",
    netsHelp:function(n,name){return "All "+n+" ways to unfold a "+name+". Nothing else folds up.";},
    sCube:"cube", sTetra:"triangle pyramid", sPyr:"square pyramid", sPrism:"triangle prism", sOcta:"octahedron",
    qNet:"Would this fold into a cube?", yes:"It folds", no:"It doesn't",
    qOpp:"Tap the square that ends up opposite the ★.",
    next:"Next shape", nextO:"Next puzzle",
    okNet:"Yes — it folds.", badNet:"No — it doesn't.",
    okNetW:"All six squares land on six different sides.",
    clashW:function(n,h){return n+" squares land on the same side"+(h?", so the box has "+h+" hole"+(h>1?"s":""):"")+".";},
    right:"Nice.", wrong:"Not this one.",
    oppOk:function(a,b){return "Square "+a+" and square "+b+" never touch — they end up on opposite sides.";},
    oppBad:function(a,b,c){return "Square "+a+" touches the ★ square when it folds. The one across is square "+c+".";},
    cubeOnly:"This game uses cubes only.",
    streak:"Streak", best:"Best", solved:"Solved"
  },
  vi:{
    brand:"Bàn Thợ", tagline:"trò chơi nhỏ cho bạn nhỏ tò mò", back:"Quay lại", lang:"English",
    lede:["Học bằng cách ","nghịch cho tới khi hiểu","."],
    sub:"Chọn một xưởng. Mỗi xưởng có vài trò chơi nhỏ, chỉ thắng được khi mình thật sự hiểu.",
    soon:"đang làm",
    modCube:"Xưởng Hình Khối", modCubeP:"Trải một khối thành giấy phẳng, rồi gấp lại.",
    modTimes:"Bảng Nhân", modTimesP:"Sắp có.",
    modFrac:"Phân Số", modFracP:"Sắp có.",
    modClock:"Xem Giờ", modClockP:"Sắp có.",
    gFold:"Gấp thử", gNet:"Gấp được không?", gOpp:"Mặt đối diện",
    gFoldP:"Trải năm khối khác nhau.", gNetP:"Tờ giấy này có thành khối lập phương không?", gOppP:"Ô nào nằm đối diện?",
    shape:"Khối", pattern:"Hình trải", fold:"Gấp", flat:"PHẲNG", solid:"KHỐI",
    foldIt:"Gấp lại", flatten:"Trải phẳng", drag:"KÉO NỀN ĐỂ XOAY", reset:"Xoay về giữa",
    nets:"Hình trải",
    netsHelp:function(n,name){return "Cả "+n+" cách trải một "+name+". Ngoài ra thì không gấp được.";},
    sCube:"khối lập phương", sTetra:"khối chóp tam giác", sPyr:"khối chóp vuông", sPrism:"khối lăng trụ tam giác", sOcta:"khối bát diện",
    qNet:"Hình này có gấp thành khối lập phương không?", yes:"Gấp được", no:"Không được",
    qOpp:"Chạm vào ô sẽ nằm đối diện ô ★.",
    next:"Hình khác", nextO:"Câu khác",
    okNet:"Đúng — gấp được.", badNet:"Không — gấp không được.",
    okNetW:"Sáu ô rơi vào đúng sáu mặt khác nhau.",
    clashW:function(n,h){return n+" ô rơi vào cùng một mặt"+(h?", nên khối bị hở "+h+" chỗ":"")+".";},
    right:"Giỏi lắm.", wrong:"Chưa đúng.",
    oppOk:function(a,b){return "Ô "+a+" và ô "+b+" không bao giờ chạm nhau — hai ô nằm đối diện.";},
    oppBad:function(a,b,c){return "Ô "+a+" chạm vào ô ★ khi gấp. Ô đối diện là ô "+c+".";},
    cubeOnly:"Trò này chỉ dùng khối lập phương.",
    streak:"Chuỗi", best:"Kỷ lục", solved:"Đã giải"
  }
};
let L = "en";
const t = k => T[L][k];

/* ============================================================
   2. GEOMETRY

   Two producers, one consumer.
   (a) grid nets  — 6 squares on a grid, used by the cube quizzes
                    (they need INVALID shapes too, which only the
                    grid enumeration can give us)
   (b) solid nets — any polyhedron, unfolded along a spanning tree
   Both emit the same flat-net format that the renderer eats.
   ============================================================ */

/* --- vectors --- */
const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const mul3=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const crs3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len3=a=>Math.sqrt(dot3(a,a));
const nrm3=a=>mul3(a,1/len3(a));
const mean3=ps=>mul3(ps.reduce(add3,[0,0,0]),1/ps.length);

/* --- (a) grid: hexominoes and cube folding --- */
const DIRS = [[0,1,"right"],[0,-1,"left"],[1,0,"down"],[-1,0,"up"]];
const key = (r,c) => r+","+c;
const neg = v => [-v[0],-v[1],-v[2]];

function normalize(cells){
  const mr=Math.min(...cells.map(p=>p[0])), mc=Math.min(...cells.map(p=>p[1]));
  return cells.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
}
const sig = cells => normalize(cells).map(p=>p.join(",")).join(" ");
function freeSig(cells){
  const out=[]; let cur=cells;
  for(let i=0;i<4;i++){
    cur=cur.map(([r,c])=>[c,-r]);
    out.push(sig(cur)); out.push(sig(cur.map(([r,c])=>[r,-c])));
  }
  return out.sort()[0];
}
function generateHexominoes(){
  let shapes=new Map([[sig([[0,0]]),[[0,0]]]]);
  for(let k=1;k<6;k++){
    const next=new Map();
    for(const s of shapes.values()){
      const set=new Set(s.map(p=>key(p[0],p[1])));
      for(const [r,c] of s) for(const [dr,dc] of DIRS){
        const p=[r+dr,c+dc];
        if(set.has(key(p[0],p[1]))) continue;
        const cand=[...s,p];
        next.set(freeSig(cand), normalize(cand));
      }
    }
    shapes=next;
  }
  return [...shapes.values()];
}
/* fold a child square 90° up toward the viewer and carry its orientation with it */
function childFrame(f,dir){
  const {R,D,N}=f;
  if(dir==="right") return {R:N,      D:D,      N:neg(R)};
  if(dir==="left")  return {R:neg(N), D:D,      N:R};
  if(dir==="down")  return {R:R,      D:N,      N:neg(D)};
  return                   {R:R,      D:neg(N), N:D};
}
const faceId = v => v[0] ? (v[0]>0?0:1) : v[1] ? (v[1]>0?2:3) : (v[2]>0?4:5);

/* the square that stays put while everything folds up around it */
function pickRoot(cells){
  const set=new Set(cells.map(p=>key(p[0],p[1])));
  let best=0,bestScore=-Infinity;
  cells.forEach((p,i)=>{
    const deg=DIRS.filter(([dr,dc])=>set.has(key(p[0]+dr,p[1]+dc))).length;
    const dist=cells.reduce((a,q)=>a+Math.abs(q[0]-p[0])+Math.abs(q[1]-p[1]),0);
    const score=deg*100-dist;
    if(score>bestScore){bestScore=score;best=i;}
  });
  return best;
}
function analyze(cells,root){
  const r0 = root==null ? pickRoot(cells) : root;
  const map=new Map(cells.map((p,i)=>[key(p[0],p[1]),i]));
  const frames=Array(cells.length).fill(null), parent=Array(cells.length).fill(-1), hinge=Array(cells.length).fill(null);

function faceNormal(V,face){
  let n=[0,0,0];
  for(let k=0;k<face.length;k++) n=add3(n,crs3(V[face[k]],V[face[(k+1)%face.length]]));
  return nrm3(n);

function prepSolid(def){

  F.forEach(f=>{ if(dot3(faceNormal(V,f), sub3(mean3(f.map(i=>V[i])),C))<0) f.reverse(); });
  const N=F.map(f=>faceNormal(V,f));

  F.forEach((f,fi)=>{ for(let k=0;k<f.length;k++){
    const a=f[k],b=f[(k+1)%f.length], kk=Math.min(a,b)+"_"+Math.max(a,b);
    if(!em.has(kk)) em.set(kk,[]);
    em.get(kk).push({fi,a,b});

  const adj=[];
  for(const list of em.values()){
    if(list.length!==2) continue;
    const [x,y]=list;
    adj.push({i:x.fi,j:y.fi,e:[Math.min(x.a,x.b),Math.max(x.a,x.b)],

    const o=s.V[ia], e1=nrm3(sub3(s.V[ib],o)), e3=mul3(s.N[fi],-1), e2=crs3(e3,e1);

      seen.add(to); parent[to]=fi;
      const [ia,ib]=t.e, A2=pos[fi].get(ia), B2=pos[fi].get(ib);
      put(to,ia,ib,A2,B2);

function polysOverlap(A,B){
  for(const poly of [A,B]) for(let k=0;k<poly.length;k++){
    const p=poly[k],q=poly[(k+1)%poly.length];
    const ax=-(q[1]-p[1]), ay=q[0]-p[0];
    let a1=Infinity,a2=-Infinity,b1=Infinity,b2=-Infinity;
    for(const v of A){const d=v[0]*ax+v[1]*ay;a1=Math.min(a1,d);a2=Math.max(a2,d);}
    for(const v of B){const d=v[0]*ax+v[1]*ay;b1=Math.min(b1,d);b2=Math.max(b2,d);}

function netsOfSolid(name){
  if(solidCache[name]) return solidCache[name];

function rotAbout(p,A,d,ang){            // rotate 3D point p about the line through A with direction d

  const kv=crs3(d,v), kd=dot3(d,v);
  return [v[0]*c+kv[0]*s+d[0]*kd*(1-c)+A[0],
          v[1]*c+kv[1]*s+d[1]*kd*(1-c)+A[1],
          v[2]*c+kv[2]*s+d[2]*kd*(1-c)+A[2]];
}
const SVGNS="http://www.w3.org/2000/svg";
class FoldView{

      {id:"opp",  name:"gOpp",  blurb:"gOppP",  render:renderOpposite}
    ]},
  // ——— add new modules here ———
  { id:"times", name:"modTimes", blurb:"modTimesP" },
  { id:"frac",  name:"modFrac",  blurb:"modFracP" },
  { id:"clock", name:"modClock", blurb:"modClockP" }
];

/* ---------- 6. routing + screens ---------- */
const main=document.getElementById("main");
const backBtn=document.getElementById("backBtn");
const langBtn=document.getElementById("langBtn");
let route={mod:null,game:"fold"};
let view=null;

function render(){
  document.getElementById("brand").firstChild.textContent=t("brand");
  document.getElementById("tagline").textContent=t("tagline");
  langBtn.textContent=t("lang");
  backBtn.hidden=!route.mod;
  backBtn.querySelector("span").textContent=t("back");
  main.innerHTML=""; view=null; onFoldTick=null;
  route.mod ? renderModule() : renderHub();
}
backBtn.onclick=()=>{route.mod=null;render();};
langBtn.onclick=()=>{L=L==="en"?"vi":"en"; document.documentElement.lang=L; render();};

function renderHub(){
  const wrap=h("div","hub");
  const p=t("lede");
  const lede=h("h1","lede"); lede.append(p[0],h("em",null,p[1]),p[2]);
  wrap.append(lede,h("p","sub",t("sub")));
  const cards=h("div","cards");
  MODULES.forEach((m,i)=>{
    const c=h("button","card"+(m.live?"":" soon"));
    if(m.live){
      const strip=h("div","strip");
      m.colors.forEach(n=>{const s=h("span");s.style.background="var(--c"+n+")";strip.appendChild(s);});
      c.appendChild(strip);
    }
    c.append(h("span","tag",m.live?String(i+1).padStart(2,"0"):t("soon")),
             h("h3",null,t(m.name)),h("p",null,t(m.blurb)));
    if(m.live) c.onclick=()=>{route={mod:m.id,game:m.games[0].id};render();};
    else c.disabled=true;
    cards.appendChild(c);
  });
  wrap.appendChild(cards);
  main.appendChild(wrap);
}

function renderModule(){
  const mod=MODULES.find(m=>m.id===route.mod);
  const tabs=h("div","tabs");
  mod.games.forEach(g=>{
    const b=h("button","tab",t(g.name));
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected",g.id===route.game);
    b.onclick=()=>{route.game=g.id;render();};
    tabs.appendChild(b);
  });
  main.appendChild(tabs);
  const lab=h("div","lab");
  const stage=h("div","stage");
  stage.append(h("div","hint",t("drag")));
  const rb=h("button","reset",t("reset"));
  stage.appendChild(rb);
  const side=h("div","side");
  lab.append(stage,side);
  main.appendChild(lab);
  view=new FoldView(stage);
  rb.onclick=()=>view.resetView();
  mod.games.find(g=>g.id===route.game).render(side,stage);
}

/* ---------- 7. game 1 — Fold Lab ---------- */
let foldShape="cube", foldIdx=0;
function renderFoldLab(side){
  let nets=[];

  const p0=h("div","panel");
  p0.append(h("h4",null,t("shape").toUpperCase()));
  const shapes=h("div","shapes");
  SHAPES.forEach(s=>{
    const b=h("button","shape",t(s.name));
    b.setAttribute("aria-pressed",s.id===foldShape);
    b.onclick=()=>{ foldShape=s.id; foldIdx=0; loadShape(); };
    shapes.appendChild(b);
  });
  p0.appendChild(shapes);

  const p1=h("div","panel");
  p1.append(h("h4",null,t("fold").toUpperCase()));
  const lw=h("div","lever-wrap");
  lw.appendChild(h("div","ticks"));
  const lever=document.createElement("input");
  lever.type="range";lever.min=0;lever.max=1000;lever.value=0;lever.className="lever";
  lever.setAttribute("aria-label",t("fold"));
  lw.appendChild(lever);
  const ll=h("div","leverlab"); ll.append(h("span",null,t("flat")),h("span",null,t("solid")));
  lw.appendChild(ll);
  p1.appendChild(lw);
  const rowb=h("div","rowbtns"); rowb.style.marginTop="14px";
  const bFold=h("button","btn",t("foldIt")), bFlat=h("button","btn alt",t("flatten"));
  rowb.append(bFold,bFlat); p1.appendChild(rowb);

  const p2=h("div","panel");
  const h4=h("h4",null,t("nets").toUpperCase());
  const strip=h("div","strip-nets");
  const note=h("p","note");
  p2.append(h4,strip,note);

  side.append(p0,p1,p2);
  lever.oninput=()=>view.setFold(lever.value/1000);
  onFoldTick=v=>lever.value=Math.round(v*1000);
  bFold.onclick=()=>view.animateTo(1);
  bFlat.onclick=()=>view.animateTo(0);

  function loadShape(){
    nets=netsOfSolid(foldShape);
    if(foldIdx>=nets.length) foldIdx=0;
    [...shapes.children].forEach((b,k)=>b.setAttribute("aria-pressed",SHAPES[k].id===foldShape));
    strip.innerHTML="";
    nets.forEach((n,i)=>{
      const b=h("button","thumb"); b.appendChild(netThumb(n));
      b.setAttribute("aria-pressed",i===foldIdx);
      b.onclick=()=>{ foldIdx=i; show(); [...strip.children].forEach((x,k)=>x.setAttribute("aria-pressed",k===i)); };
      strip.appendChild(b);
    });
    note.textContent=t("netsHelp")(nets.length,t(SHAPES.find(s=>s.id===foldShape).name));
    show();
  }
  function show(){
    view.setNet(nets[foldIdx]);
    view.setFold(0); lever.value=0; view.resetView();
  }
  loadShape();
}

/* ---------- 8. game 2 — Folds or not? (cubes) ---------- */
function renderNetQuiz(side,stage){
  let streak=0,best=0,solved=0,answered=false,a=null;

  const p=h("div","panel");
  const q=h("div","q",t("qNet"));
  const row=h("div","rowbtns");
  const bYes=h("button","btn big yes",t("yes")), bNo=h("button","btn big no",t("no"));
  row.append(bYes,bNo);
  const vbox=h("div"); const nextRow=h("div","rowbtns");
  const bNext=h("button","btn",t("next")); nextRow.appendChild(bNext); nextRow.hidden=true;
  p.append(q,row,vbox,nextRow);

  const sc=h("div","panel score");
  const mk=lab=>{const d=h("div");const b=h("b","0");d.append(b,document.createTextNode(t(lab)));return[d,b];};
  const [d1,vStreak]=mk("streak"),[d2,vBest]=mk("best"),[d3,vSolved]=mk("solved");
  sc.append(d1,d2,d3);
  side.append(p,sc);

  function deal(){
    answered=false; vbox.innerHTML=""; row.hidden=false; nextRow.hidden=true;
    const cells=Math.random()<0.5?rand(NETS_CUBE):rand(NOTNETS);
    const net=netFromCells(cells); a=net.analysis;
    view.setNet(net,{clashSides:a.sides});
    view.setFold(0); view.resetView();
  }
  function answer(said){
    if(answered) return; answered=true;
    const ok=(said===a.valid);
    row.hidden=true; nextRow.hidden=false;
    const v=h("div","verdict "+(ok?"ok":"bad"));
    v.append(h("b",null,ok?t("right"):t("wrong")));
    v.append(document.createTextNode(
      a.valid ? t("okNet")+" "+t("okNetW") : t("badNet")+" "+t("clashW")(a.stacked,a.holes)));
    vbox.appendChild(v);
    if(ok){streak++;solved++;best=Math.max(best,streak);scraps(stage);} else streak=0;
    vStreak.textContent=streak; vBest.textContent=best; vSolved.textContent=solved;
    view.animateTo(1,1100);
    if(!a.valid) setTimeout(()=>view.showClash(true),1100);
  }
  bYes.onclick=()=>answer(true);
  bNo.onclick=()=>answer(false);
  bNext.onclick=deal;
  deal();
}

/* ---------- 9. game 3 — Opposite sides (cubes) ---------- */
function renderOpposite(side,stage){
  let streak=0,best=0,solved=0,answered=false,star=0,a=null;

  const p=h("div","panel");
  const q=h("div","q",t("qOpp"));
  const vbox=h("div");
  const nextRow=h("div","rowbtns");
  const bNext=h("button","btn",t("nextO")); nextRow.appendChild(bNext); nextRow.hidden=true;
  p.append(q,vbox,nextRow);

  const sc=h("div","panel score");
  const mk=lab=>{const d=h("div");const b=h("b","0");d.append(b,document.createTextNode(t(lab)));return[d,b];};
  const [d1,vStreak]=mk("streak"),[d2,vBest]=mk("best"),[d3,vSolved]=mk("solved");
  sc.append(d1,d2,d3);
  side.append(p,sc);

  function deal(){
    answered=false; vbox.innerHTML=""; nextRow.hidden=true;
    const net=netFromCells(rand(NETS_CUBE)); a=net.analysis;
    star=Math.floor(Math.random()*6);
    view.onFace=pick;
    view.setNet(net,{star:star});
    view.setFold(0); view.resetView();
  }
  function pick(i){
    if(answered||i===star) return;
    answered=true;
    const target=a.sides.indexOf(a.sides[star]^1);   // ^1 flips +axis to -axis
    const ok=i===target;
    view.mark(i,true); view.mark(target,true);
    const v=h("div","verdict "+(ok?"ok":"bad"));
    v.append(h("b",null,ok?t("right"):t("wrong")));
    v.append(document.createTextNode(ok?t("oppOk")(star+1,target+1):t("oppBad")(i+1,star+1,target+1)));
    vbox.appendChild(v); nextRow.hidden=false;
    if(ok){streak++;solved++;best=Math.max(best,streak);scraps(stage);} else streak=0;
    vStreak.textContent=streak; vBest.textContent=best; vSolved.textContent=solved;
    view.animateTo(1,1100);
  }
  bNext.onclick=deal;
  deal();
}

/* ---------- go ---------- */
render();
</script>
