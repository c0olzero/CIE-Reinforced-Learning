<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench — mini-games for curious kids</title>
<meta name="description" content="Free interactive mini-games for the Cambridge Primary curriculum. No accounts, no tracking.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E3A35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/games.css">
<link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
<div class="shell">
  <div class="bar">
    <div class="mark"><i></i><i></i></div>
    <div class="brand" id="brand">Workbench<small id="tagline">mini-games for curious kids</small></div>
    <div class="spacer"></div>
    <button class="chip ghost" id="backBtn" hidden>← <span>Back</span></button>
    <button class="chip" id="langBtn">Tiếng Việt</button>
  </div>
  <main id="main"></main>
</div>
<div class="phoneblock">
  <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
    <rect x="8" y="10" width="48" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="32" y1="42" x2="32" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="50" x2="40" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <p><b>This needs a bigger screen.</b><br>Please use a tablet (turned sideways) or a computer.</p>
  <p lang="vi"><b>Cần màn hình lớn hơn.</b><br>Vui lòng dùng máy tính bảng (xoay ngang) hoặc máy tính.</p>
</div>
<script type="module" src="engine/main.js"></script>
<script>
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
